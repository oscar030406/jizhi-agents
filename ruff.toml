# ruff 的规则集。pre-commit 的 ruff-check 钩子读这个文件。
#
# 为什么是这几条，而不是 ruff 的默认集：
# - 默认集在本仓库报 916 条，绝大多数是 UP006、I001、FURB167 这类版式问题。
#   把它们一次性改掉等于一个几千行的提交，没人能审。
# - E402 和 SLF001 必须显式开。代码里已经写着 `# noqa: E402`（app/main.py 末尾
#   那几个晚导入是故意的，2026-08-16 漏挂路由那次的教训）和 `# noqa: SLF001`
#   （practice_guide 复用 practice_scout 的限流与原子写）。这两条不开，ruff 反过来
#   把这些 noqa 判成多余，提示删掉——删了以后谁开这两条就会炸。
# - E4、E7、E9、F 抓的是真错：未定义名字、未用导入、语法错误。
#
# 全树当前在这组规则下还有 118 条，都是本次任务之前就在的。钩子只查暂存的文件，
# 所以它们会在各自文件下次被改动时冒出来，按文件清。
target-version = "py312"
line-length = 120

[lint]
select = ["E4", "E7", "E9", "F", "E402", "SLF"]

[lint.per-file-ignores]
# 测试里读被测模块的私有名是正常的
"**/tests/**" = ["SLF001"]
