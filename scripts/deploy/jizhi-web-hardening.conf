[Service]
User=jizhi-web
Group=jizhi-web
UMask=0077

# 保留现有 pnpm 依赖树，只读绑定整仓；仅业务数据与 Next 图片缓存可写。
BindReadOnlyPaths=/root/jizhi-agents:/srv/jizhi-repo
BindPaths=/root/jizhi-agents/apps/classroom/data:/srv/jizhi-repo/apps/classroom/data
BindPaths=/var/cache/jizhi-web:/srv/jizhi-repo/apps/classroom/.next/cache
WorkingDirectory=/srv/jizhi-repo/apps/classroom
ExecStart=
ExecStart=/usr/bin/node /srv/jizhi-repo/apps/classroom/scripts/start-with-long-upload.mjs start -p 3210

NoNewPrivileges=yes
PrivateTmp=yes
PrivateDevices=yes
ProtectSystem=strict
ProtectHome=yes
ProtectKernelTunables=yes
ProtectKernelModules=yes
ProtectKernelLogs=yes
ProtectControlGroups=yes
ProtectClock=yes
RestrictSUIDSGID=yes
LockPersonality=yes
CapabilityBoundingSet=
AmbientCapabilities=
RestrictAddressFamilies=AF_UNIX AF_INET AF_INET6
SystemCallArchitectures=native
