[Service]
User=jizhi-web
Group=jizhi-web
Environment=
EnvironmentFile=
EnvironmentFile=/etc/jizhi-web.env
Environment=NODE_ENV=production
Environment=HOSTNAME=127.0.0.1
Environment=PORT=3210
UMask=0027

# 代码、依赖、public 与静态资源都在 current release；只有业务数据和图片缓存可写。
BindPaths=/var/lib/jizhi-web:/opt/jizhi-web/current/data
BindPaths=/var/cache/jizhi-web:/opt/jizhi-web/current/.next/cache
WorkingDirectory=/opt/jizhi-web/current
ExecStart=
ExecStart=/usr/bin/node /opt/jizhi-web/current/start-standalone.mjs

NoNewPrivileges=yes
PrivateTmp=yes
PrivateDevices=yes
ProtectSystem=strict
ProtectHome=yes
ProtectKernelTunables=yes
ProtectKernelModules=yes
ProtectKernelLogs=yes
ProtectControlGroups=yes
ProtectClock=yes
RestrictSUIDSGID=yes
LockPersonality=yes
CapabilityBoundingSet=
AmbientCapabilities=
RestrictAddressFamilies=AF_UNIX AF_INET AF_INET6
SystemCallArchitectures=native
