[Service]
User=jizhi-engine
Group=jizhi-engine

# systemd 先以 root 绑定只读代码，再降权；服务进程无法遍历 /root。
BindReadOnlyPaths=/root/jizhi-agents/apps/agent-engine:/srv/jizhi-engine
BindPaths=/root/jizhi-agents/apps/agent-engine/data:/srv/jizhi-engine/data
WorkingDirectory=/srv/jizhi-engine
Environment=PYTHONPATH=/srv/jizhi-engine/.venv/lib/python3.12/site-packages:/srv/jizhi-engine
ExecStart=
ExecStart=/usr/bin/python3 -m uvicorn app.main:app --host 127.0.0.1 --port 8001

NoNewPrivileges=yes
PrivateTmp=yes
PrivateDevices=yes
ProtectSystem=strict
ProtectHome=yes
ProtectKernelTunables=yes
ProtectKernelModules=yes
ProtectKernelLogs=yes
ProtectControlGroups=yes
ProtectClock=yes
RestrictSUIDSGID=yes
LockPersonality=yes
CapabilityBoundingSet=
AmbientCapabilities=
RestrictAddressFamilies=AF_UNIX AF_INET AF_INET6
SystemCallArchitectures=native
