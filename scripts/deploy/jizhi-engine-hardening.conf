[Service]
User=jizhi-engine
Group=jizhi-engine
Environment=
EnvironmentFile=
EnvironmentFile=/etc/jizhi-engine.env
UMask=0027

# 代码与依赖一起版本化；current 只指向已校验的 release，业务数据单独可写。
BindReadOnlyPaths=/opt/jizhi-engine/current:/srv/jizhi-engine
BindPaths=/var/lib/jizhi-engine:/srv/jizhi-engine/data
BindReadOnlyPaths=/var/lib/jizhi-web/usage:/srv/classroom/data/usage
WorkingDirectory=/srv/jizhi-engine
ExecStart=
ExecStart=/srv/jizhi-engine/.venv/bin/python -m uvicorn app.main:app --host 127.0.0.1 --port 8001

NoNewPrivileges=yes
PrivateTmp=yes
PrivateDevices=yes
ProtectSystem=strict
ProtectHome=yes
ProtectKernelTunables=yes
ProtectKernelModules=yes
ProtectKernelLogs=yes
ProtectControlGroups=yes
ProtectClock=yes
RestrictSUIDSGID=yes
LockPersonality=yes
CapabilityBoundingSet=
AmbientCapabilities=
RestrictAddressFamilies=AF_UNIX AF_INET AF_INET6
SystemCallArchitectures=native
